<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Frontend - API CRUD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
            margin-right: 10px;
        }

        .btn:hover {
            background: #5568d3;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-update {
            background: #3498db;
        }

        .btn-update:hover {
            background: #2980b9;
        }

        .produtos-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .produto-card {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            background: #f9f9f9;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .produto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .produto-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .produto-info {
            margin-bottom: 15px;
        }

        .produto-info p {
            margin: 5px 0;
            color: #555;
        }

        .produto-info strong {
            color: #333;
        }

        .preco {
            font-size: 24px;
            color: #27ae60;
            font-weight: bold;
        }

        .estoque {
            color: #3498db;
            font-weight: 600;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            padding: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .produtos-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Sistema de Gerenciamento de Produtos</h1>
        <p class="subtitle">Exemplo de Frontend consumindo a API FastAPI</p>

        <div id="alert-container"></div>

        <!-- Formulário para criar produto -->
        <div class="section">
            <h2>➕ Adicionar Novo Produto</h2>
            <form id="form-criar">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome do Produto:</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço (R$):</label>
                        <input type="number" id="preco" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="estoque">Quantidade em Estoque:</label>
                        <input type="number" id="estoque" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição:</label>
                        <textarea id="descricao"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn">Criar Produto</button>
            </form>
        </div>

        <!-- Lista de produtos -->
        <div class="section">
            <h2>📦 Lista de Produtos</h2>
            <button onclick="carregarProdutos()" class="btn">🔄 Atualizar Lista</button>
            <div id="produtos-container" class="produtos-list">
                <div class="loading">Carregando produtos...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Função para mostrar alertas
        function mostrarAlerta(mensagem, tipo = 'success') {
            const alertContainer = document.getElementById('alert-container');
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo}`;
            alert.textContent = mensagem;
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Função para carregar produtos
        async function carregarProdutos() {
            const container = document.getElementById('produtos-container');
            container.innerHTML = '<div class="loading">Carregando produtos...</div>';

            try {
                const response = await fetch(`${API_URL}/produtos`);
                if (!response.ok) throw new Error('Erro ao carregar produtos');

                const produtos = await response.json();
                
                if (produtos.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: #666;">Nenhum produto encontrado.</p>';
                    return;
                }

                container.innerHTML = '';
                produtos.forEach(produto => {
                    container.appendChild(criarCardProduto(produto));
                });
            } catch (error) {
                container.innerHTML = `<p style="color: red; text-align: center;">Erro: ${error.message}</p>`;
                mostrarAlerta('Erro ao carregar produtos. Verifique se a API está rodando.', 'error');
            }
        }

        // Função para criar card de produto
        function criarCardProduto(produto) {
            const card = document.createElement('div');
            card.className = 'produto-card';
            card.innerHTML = `
                <h3>${produto.nome}</h3>
                <div class="produto-info">
                    <p>${produto.descricao || 'Sem descrição'}</p>
                    <p class="preco">R$ ${produto.preco.toFixed(2)}</p>
                    <p class="estoque">Estoque: ${produto.estoque} unidades</p>
                </div>
                <button class="btn btn-update" onclick="atualizarProduto(${produto.id})">✏️ Editar</button>
                <button class="btn btn-delete" onclick="deletarProduto(${produto.id})">🗑️ Deletar</button>
            `;
            return card;
        }

        // Função para criar produto
        document.getElementById('form-criar').addEventListener('submit', async (e) => {
            e.preventDefault();

            const produto = {
                nome: document.getElementById('nome').value,
                descricao: document.getElementById('descricao').value,
                preco: parseFloat(document.getElementById('preco').value),
                estoque: parseInt(document.getElementById('estoque').value)
            };

            try {
                const response = await fetch(`${API_URL}/produtos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(produto)
                });

                if (!response.ok) throw new Error('Erro ao criar produto');

                mostrarAlerta('Produto criado com sucesso!');
                e.target.reset();
                carregarProdutos();
            } catch (error) {
                mostrarAlerta('Erro ao criar produto: ' + error.message, 'error');
            }
        });

        // Função para deletar produto
        async function deletarProduto(id) {
            if (!confirm('Tem certeza que deseja deletar este produto?')) return;

            try {
                const response = await fetch(`${API_URL}/produtos/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Erro ao deletar produto');

                mostrarAlerta('Produto deletado com sucesso!');
                carregarProdutos();
            } catch (error) {
                mostrarAlerta('Erro ao deletar produto: ' + error.message, 'error');
            }
        }

        // Função para atualizar produto
        async function atualizarProduto(id) {
            const novoPreco = prompt('Digite o novo preço:');
            if (!novoPreco) return;

            try {
                const response = await fetch(`${API_URL}/produtos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        preco: parseFloat(novoPreco)
                    })
                });

                if (!response.ok) throw new Error('Erro ao atualizar produto');

                mostrarAlerta('Produto atualizado com sucesso!');
                carregarProdutos();
            } catch (error) {
                mostrarAlerta('Erro ao atualizar produto: ' + error.message, 'error');
            }
        }

        // Carregar produtos ao iniciar
        carregarProdutos();
    </script>
</body>
</html>
